name: 원자재 스냅샷

# 원본 API 어디에도 CORS 헤더가 없어 허브가 브라우저에서 직접 못 읽는다.
# 여기서 서버 측으로 받아 data/raw-material.json 에 커밋하면
# 허브는 같은 출처에서 읽으므로 CORS 가 걸리지 않는다.
#
# 스크립트는 출처를 이중화해 둬서 한쪽이 죽어도 나머지 타일은 나온다.
# 타일이 하나도 안 나올 때만 exit 1 이고, 그때는 이 잡이 실패로 뜨면서
# 직전 스냅샷이 그대로 남는다 (빈 레일보다 어제 값이 낫다).

on:
  schedule:
    # 원본은 08:00 KST 에 갱신된다. 그 30분 뒤 = 23:30 UTC.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raw-material
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 스냅샷 갱신
        # 실패하면(=타일 0개) 잡이 빨갛게 뜬다. 그게 알림 역할을 한다.
        run: python scripts/fetch_raw_material.py

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- data/raw-material.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw-material.json
          git commit -m "원자재 스냅샷 $(date -u +%Y-%m-%d)"
          git push
