name: 오늘의 일정 브리핑
# 평일 06:30 KST. 로직은 scripts/daily_brief.sh
on:
  schedule:
    - cron: '30 21 * * 0-4'
  workflow_dispatch:
    inputs:
      test:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-brief
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/daily_brief.sh "${{ inputs.test }}"
